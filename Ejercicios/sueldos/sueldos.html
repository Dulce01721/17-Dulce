<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sueldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="sueldos.css">
</head>
<body class="p-4">

    <h1 class="mb-3">Calcular Sueldos</h1>

    <table class="table table-bordered text-center mb-4">
        <thead>
            <tr>
                <th>Puesto</th>
                <th>Novato</th>
                <th>Jr</th>
                <th>Sr</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Diseñador</td>
                <td>120</td>
                <td>180</td>
                <td>280</td>
            </tr>
            <tr>
                <td>Programador</td>
                <td>120</td>
                <td>280</td>
                <td>340</td>
            </tr>
            <tr>
                <td>Líder</td>
                <td>240</td>
                <td>520</td>
                <td>890</td>
            </tr>
        </tbody>
    </table>

    <label class="form-label">Puesto:</label>
    <select id="puesto" class="form-select mb-3" onchange="cotizar()">
        <option value="disenador">Diseñador</option>
        <option value="programador">Programador</option>
        <option value="lider">Líder</option>
    </select>

    <label class="form-label">Nivel:</label>
    <select id="nivel" class="form-select mb-3" onchange="cotizar()">
        <option value="novato">Novato</option>
        <option value="junior">Junior</option>
        <option value="senior">Senior</option>
    </select>

    <label class="form-label">Horas:</label>
    <input type="number" id="horas" class="form-control mb-3" oninput="cotizar()">

    <label class="form-label">Total:</label>
    <input type="text" id="resTotal" class="form-control fw-bold fs-5 text-success mb-3" value="$">

    

    <script src="sueldos.js"></script>
</body>
</html>
