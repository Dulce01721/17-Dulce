<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disco - Práctica 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Gorditas:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css"/>
</head>
<body class="disco">
    <main> 
        <nav id="menu">
            <h3>Menú</h3>
            <ul>
                <li><a href="home.html">Inicio</a></li>
                <li><a href="formulario_1.html">Disco</a></li>
                <li><a href="formulario_2.html">Cantante</a></li>
                <li><a href="formulario_3.html">Canción</a></li>
                <li><a href="formulario_4.html">Playlist</a></li>
            </ul>
        </nav>
        <section id="contenido"> 
            <h1>Disco</h1>
            <section id="formulario">
                <form id="formDisco">
                    <section class="campo">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre"/>
                    </section>
                    <section class="campo">
                        <label for="genero">Genero:</label>
                        <input type="text" id="genero"/>
                    </section>
                    <section class="campo">
                        <label for="artista">Artista:</label>
                        <select id="artista">
                            <option value="">Selecciona un artista</option>
                            <option value="Fuerza Regida">Fuerza Regida</option>
                            <option value="Junior H">Junior H</option>
                            <option value="Peso Pluma">Peso Pluma</option>
                        </select>
                    </section>
                    <section class="campo">
                        <label for="precio">Precio:</label>
                        <input type="number" id="precio"/>
                    </section>
                    <section class="boton">
                        <button type="button" onclick="guardarRegistro()">Guardar</button>
                    </section>
                </form>
                <aside class="foto">
                    <img src="css/disco.webp" alt="Imagen disco"/>
                    <input type="file" id="archivo"/>
                </aside>
            </section>
        </section> 
    </main> 
    <footer>
         <section class="pie">LDSM401</section>
         <section class="pie">Dulce Maria Victorino Monjaraz</section>
    </footer>
    <script src="funcionalidad.js"></script>
</body> 
</html>
